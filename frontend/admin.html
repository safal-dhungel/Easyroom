<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - EasyRoom</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <div id="navbarContainer"></div>

  <!-- Main Container -->
  <main class="container my-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
      <div>
        <h2 class="fw-bold mb-1"><i class="bi bi-shield-check text-primary me-2"></i>Admin Dashboard</h2>
        <p class="text-muted mb-0">Manage system users, listings, and oversight</p>
      </div>
      <div>
        <span class="badge bg-danger fs-6 px-3 py-2 rounded-pill">
          <i class="bi bi-lock-fill me-1"></i> Admin Access
        </span>
      </div>
    </div>

    <!-- Alert Container -->
    <div id="alertContainer"></div>

    <!-- Stats Row -->
    <div class="row g-4 mb-4">
      <div class="col-md-6">
        <div class="card border-0 shadow-sm rounded-4 p-3 bg-white">
          <div class="d-flex align-items-center">
            <div class="bg-primary-subtle text-primary p-3 rounded-circle me-3 fs-3">
              <i class="bi bi-people-fill"></i>
            </div>
            <div>
              <div class="text-muted small fw-semibold text-uppercase">Total Users</div>
              <h3 class="fw-bold mb-0" id="totalUsersCount">-</h3>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card border-0 shadow-sm rounded-4 p-3 bg-white">
          <div class="d-flex align-items-center">
            <div class="bg-success-subtle text-success p-3 rounded-circle me-3 fs-3">
              <i class="bi bi-door-open-fill"></i>
            </div>
            <div>
              <div class="text-muted small fw-semibold text-uppercase">Total Rooms Listed</div>
              <h3 class="fw-bold mb-0" id="totalRoomsCount">-</h3>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Tabbed Navigation -->
    <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white">
      <div class="card-header bg-white border-bottom p-0">
        <ul class="nav nav-tabs nav-fill border-bottom-0" id="adminTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active py-3 fw-bold" id="users-tab" data-bs-toggle="tab" data-bs-target="#usersTabPane" type="button" role="tab" aria-selected="true">
              <i class="bi bi-people me-2"></i> Users Management
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link py-3 fw-bold" id="rooms-tab" data-bs-toggle="tab" data-bs-target="#roomsTabPane" type="button" role="tab" aria-selected="false">
              <i class="bi bi-house-door me-2"></i> Rooms Management
            </button>
          </li>
        </ul>
      </div>

      <div class="card-body p-4">
        <div class="tab-content" id="adminTabContent">
          
          <!-- Users Tab Pane -->
          <div class="tab-pane fade show active" id="usersTabPane" role="tabpanel" tabindex="0">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="fw-bold mb-0">Registered Users</h5>
              <button class="btn btn-outline-secondary btn-sm" onclick="loadUsers()"><i class="bi bi-arrow-clockwise me-1"></i> Refresh</button>
            </div>
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-light">
                  <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th class="text-end">Action</th>
                  </tr>
                </thead>
                <tbody id="usersTableBody">
                  <tr><td colspan="5" class="text-center py-4"><span class="spinner-border spinner-border-sm text-primary"></span> Loading...</td></tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- Rooms Tab Pane -->
          <div class="tab-pane fade" id="roomsTabPane" role="tabpanel" tabindex="0">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="fw-bold mb-0">All Listed Rooms</h5>
              <button class="btn btn-outline-secondary btn-sm" onclick="loadRooms()"><i class="bi bi-arrow-clockwise me-1"></i> Refresh</button>
            </div>
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-light">
                  <tr>
                    <th>ID</th>
                    <th>Title & Location</th>
                    <th>Owner</th>
                    <th>Rent</th>
                    <th>Status</th>
                    <th class="text-end">Action</th>
                  </tr>
                </thead>
                <tbody id="roomsTableBody">
                  <tr><td colspan="6" class="text-center py-4"><span class="spinner-border spinner-border-sm text-primary"></span> Loading...</td></tr>
                </tbody>
              </table>
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <div id="footerContainer"></div>

  <!-- Bootstrap 5 JS Bundle & Custom Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    let adminUser = null;

    document.addEventListener('DOMContentLoaded', () => {
      adminUser = requireAdmin();
      if (!adminUser) return;

      renderNavbar('admin');
      renderFooter();

      loadUsers();
      loadRooms();
    });

    async function loadUsers() {
      const tbody = document.getElementById('usersTableBody');
      try {
        const res = await fetch(`${API_BASE}/admin/users`);
        if (!res.ok) throw new Error('Failed to fetch users');
        const users = await res.json();

        document.getElementById('totalUsersCount').textContent = users.length;
        tbody.innerHTML = '';

        if (users.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-3">No users registered yet.</td></tr>';
          return;
        }

        users.forEach(u => {
          const isAdminAcc = u.email === 'admin@gmail.com';
          const row = document.createElement('tr');
          row.id = `user-row-${u.id}`;
          row.innerHTML = `
            <td><span class="badge bg-light text-dark">#${u.id}</span></td>
            <td class="fw-semibold">${u.name}</td>
            <td>${u.email} ${isAdminAcc ? '<span class="badge bg-danger ms-1">Admin</span>' : ''}</td>
            <td>${u.phone || '-'}</td>
            <td class="text-end">
              ${isAdminAcc ? '<span class="text-muted small fst-italic">Protected</span>' : `
                <button class="btn btn-outline-danger btn-sm" onclick="deleteUser(${u.id}, '${u.name}')" title="Delete User">
                  <i class="bi bi-trash"></i> Delete
                </button>
              `}
            </td>
          `;
          tbody.appendChild(row);
        });
      } catch (err) {
        console.error(err);
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-danger py-3">Error loading users.</td></tr>';
      }
    }

    async function deleteUser(userId, userName) {
      if (!confirm(`Are you sure you want to delete user "${userName}" and all their listings?`)) {
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/admin/users/${userId}`, {
          method: 'DELETE'
        });

        if (res.ok) {
          showAlert(`User "${userName}" deleted successfully`, 'success');
          loadUsers();
          loadRooms();
        } else {
          const data = await res.json();
          alert(data.error || 'Failed to delete user');
        }
      } catch (err) {
        console.error(err);
        alert('Server error occurred');
      }
    }

    async function loadRooms() {
      const tbody = document.getElementById('roomsTableBody');
      try {
        const res = await fetch(`${API_BASE}/admin/rooms`);
        if (!res.ok) throw new Error('Failed to fetch rooms');
        const rooms = await res.json();

        document.getElementById('totalRoomsCount').textContent = rooms.length;
        tbody.innerHTML = '';

        if (rooms.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-3">No room listings created yet.</td></tr>';
          return;
        }

        rooms.forEach(r => {
          const isAvailable = r.status === 'available';
          const row = document.createElement('tr');
          row.id = `room-row-${r.id}`;
          row.innerHTML = `
            <td><span class="badge bg-light text-dark">#${r.id}</span></td>
            <td>
              <div class="fw-semibold text-truncate" style="max-width: 200px;">${r.title}</div>
              <small class="text-muted"><i class="bi bi-geo-alt"></i> ${r.location}</small>
            </td>
            <td>
              <div class="fw-semibold">${r.owner_name || 'Unknown'}</div>
              <small class="text-muted">${r.owner_email || '-'}</small>
            </td>
            <td class="fw-bold text-primary">${formatPrice(r.price)}</td>
            <td>
              <span class="${isAvailable ? 'badge-available' : 'badge-rented'}">
                ${r.status.toUpperCase()}
              </span>
            </td>
            <td class="text-end">
              <a href="room-details.html?id=${r.id}" class="btn btn-light btn-sm me-1" target="_blank" title="View Room">
                <i class="bi bi-box-arrow-up-right"></i>
              </a>
              <button class="btn btn-outline-danger btn-sm" onclick="deleteAdminRoom(${r.id}, '${r.title.replace(/'/g, "\\'")}')" title="Delete Room">
                <i class="bi bi-trash"></i>
              </button>
            </td>
          `;
          tbody.appendChild(row);
        });
      } catch (err) {
        console.error(err);
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-danger py-3">Error loading rooms.</td></tr>';
      }
    }

    async function deleteAdminRoom(roomId, title) {
      if (!confirm(`Are you sure you want to delete the room listing: "${title}"?`)) {
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/admin/rooms/${roomId}`, {
          method: 'DELETE'
        });

        if (res.ok) {
          showAlert(`Room "${title}" deleted successfully`, 'success');
          loadRooms();
        } else {
          const data = await res.json();
          alert(data.error || 'Failed to delete room');
        }
      } catch (err) {
        console.error(err);
        alert('Server error occurred');
      }
    }
  </script>
</body>
</html>
