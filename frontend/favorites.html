<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saved Favorites - EasyRoom</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar -->
  <div id="navbarContainer"></div>

  <!-- Main Container -->
  <main class="container my-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
      <div>
        <h2 class="fw-bold mb-1"><i class="bi bi-heart-fill text-danger me-2"></i>Saved Favorite Rooms</h2>
        <p class="text-muted mb-0">Quickly access rooms you have bookmarked for later</p>
      </div>
      <a href="index.html" class="btn btn-outline-primary rounded-pill px-4">
        <i class="bi bi-search me-1"></i> Browse More Rooms
      </a>
    </div>

    <!-- Alert Container -->
    <div id="alertContainer"></div>

    <!-- Grid -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="favGrid">
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading favorites...</span>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div id="noFavsMessage" class="text-center py-5 d-none">
      <div class="mb-3">
        <i class="bi bi-heart text-muted" style="font-size: 3.5rem;"></i>
      </div>
      <h4 class="fw-bold">No saved rooms yet</h4>
      <p class="text-muted">Explore available listings and tap the heart icon to save rooms here.</p>
      <a href="index.html" class="btn btn-primary mt-2 rounded-pill px-4">Explore Rooms</a>
    </div>
  </main>

  <!-- Footer -->
  <div id="footerContainer"></div>

  <!-- Bootstrap 5 JS Bundle & Custom Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    let currentUser = null;

    document.addEventListener('DOMContentLoaded', () => {
      currentUser = requireAuth();
      if (!currentUser) return;

      renderNavbar('favorites');
      renderFooter();
      loadFavorites();
    });

    async function loadFavorites() {
      const grid = document.getElementById('favGrid');
      const emptyMsg = document.getElementById('noFavsMessage');

      try {
        const res = await fetch(`${API_BASE}/favorites/${currentUser.id}`);
        if (!res.ok) throw new Error('Failed to load favorites');

        const favorites = await res.json();
        grid.innerHTML = '';

        if (favorites.length === 0) {
          emptyMsg.classList.remove('d-none');
          return;
        }
        emptyMsg.classList.add('d-none');

        favorites.forEach(room => {
          const images = parseImages(room.images);
          const firstImg = images.length > 0 ? images[0] : 'https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=600&auto=format&fit=crop&q=60';
          const isAvailable = room.status === 'available';

          const col = document.createElement('div');
          col.className = 'col';
          col.id = `fav-card-${room.id}`;
          col.innerHTML = `
            <div class="card h-100 room-card">
              <div class="position-relative">
                <img src="${firstImg}" class="card-img-top room-card-img" alt="${room.title}" onerror="this.src='https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=600&auto=format&fit=crop&q=60'">
                <button type="button" class="btn-fav active" onclick="removeFavorite(${room.id})" title="Remove from favorites">
                  <i class="bi bi-heart-fill"></i>
                </button>
                <div class="position-absolute bottom-0 start-0 m-2">
                  <span class="${isAvailable ? 'badge-available' : 'badge-rented'}">
                    <i class="bi ${isAvailable ? 'bi-check-circle-fill' : 'bi-x-circle-fill'} me-1"></i>${room.status.toUpperCase()}
                  </span>
                </div>
              </div>
              <div class="card-body d-flex flex-column">
                <h5 class="card-title fw-bold text-truncate" title="${room.title}">${room.title}</h5>
                <p class="card-text text-muted small mb-2"><i class="bi bi-geo-alt-fill text-danger me-1"></i>${room.location}</p>
                <div class="d-flex justify-content-between align-items-center mt-auto pt-3 border-top">
                  <div>
                    <span class="fs-5 fw-bold text-primary">${formatPrice(room.price)}</span>
                    <span class="text-muted small">/mo</span>
                  </div>
                  <a href="room-details.html?id=${room.id}" class="btn btn-outline-primary btn-sm px-3 rounded-pill">
                    View Details <i class="bi bi-arrow-right ms-1"></i>
                  </a>
                </div>
              </div>
            </div>
          `;
          grid.appendChild(col);
        });

      } catch (err) {
        console.error(err);
        grid.innerHTML = '';
        showAlert('Could not load favorites. Please check server.', 'danger');
      }
    }

    async function removeFavorite(roomId) {
      try {
        const res = await fetch(`${API_BASE}/favorites/toggle`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: currentUser.id, room_id: roomId })
        });

        if (res.ok) {
          const card = document.getElementById(`fav-card-${roomId}`);
          if (card) card.remove();
          const grid = document.getElementById('favGrid');
          if (grid.children.length === 0) {
            document.getElementById('noFavsMessage').classList.remove('d-none');
          }
        } else {
          alert('Failed to remove favorite');
        }
      } catch (err) {
        console.error(err);
        alert('Server error occurred');
      }
    }
  </script>
</body>
</html>
