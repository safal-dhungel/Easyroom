<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - EasyRoom</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar -->
  <div id="navbarContainer"></div>

  <!-- Main Container -->
  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card p-4 p-md-5 form-card">
          <div class="text-center mb-4">
            <div class="bg-primary-subtle text-primary d-inline-flex p-3 rounded-circle mb-3">
              <i class="bi bi-person-lock fs-2"></i>
            </div>
            <h3 class="fw-bold">Welcome Back</h3>
            <p class="text-muted">Sign in to your EasyRoom account</p>
          </div>

          <!-- Alert Container -->
          <div id="alertContainer"></div>

          <form id="loginForm">
            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
                <input type="email" id="email" class="form-control" placeholder="name@example.com" required autocomplete="email">
              </div>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-key"></i></span>
                <input type="password" id="password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
                <button type="button" class="btn btn-outline-secondary" onclick="togglePasswordVisibility()">
                  <i class="bi bi-eye" id="togglePassIcon"></i>
                </button>
              </div>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary btn-lg w-100 rounded-pill shadow-sm mb-3">
              Sign In
            </button>
          </form>

          <div class="text-center pt-3 border-top mt-2">
            <p class="text-muted mb-0">Don't have an account? <a href="register.html" class="text-primary fw-semibold text-decoration-none">Register here</a></p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <div id="footerContainer"></div>

  <!-- Bootstrap 5 JS Bundle & Custom Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, redirect
      const user = getAuthUser();
      if (user) {
        window.location.href = user.isAdmin ? 'admin.html' : 'index.html';
        return;
      }

      renderNavbar('login');
      renderFooter();

      document.getElementById('loginForm').addEventListener('submit', handleLogin);
    });

    function togglePasswordVisibility() {
      const passInput = document.getElementById('password');
      const icon = document.getElementById('togglePassIcon');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        passInput.type = 'password';
        icon.className = 'bi bi-eye';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      clearAlert();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submitBtn');

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing In...';

      try {
        const res = await fetch(`${API_BASE}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok) {
          setAuthUser(data.user);
          const redirect = new URLSearchParams(window.location.search).get('redirect');
          if (data.user.isAdmin) {
            window.location.href = 'admin.html';
          } else if (redirect) {
            window.location.href = redirect;
          } else {
            window.location.href = 'index.html';
          }
        } else {
          showAlert(data.error || 'Invalid login credentials', 'danger');
        }
      } catch (err) {
        console.error(err);
        showAlert('Cannot connect to server. Please ensure backend is running.', 'danger');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Sign In';
      }
    }
  </script>
</body>
</html>
