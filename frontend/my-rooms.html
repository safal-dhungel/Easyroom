<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Listings - EasyRoom</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body style="font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; background-color: #f8fafc; color: #334155; min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Navbar -->
  <div id="navbarContainer"></div>

  <!-- Main Container -->
  <main class="container my-5" style="flex: 1;">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
      <div>
        <h2 class="fw-bold mb-1" style="color: #0f172a;">My Room Listings</h2>
        <p class="text-muted mb-0" style="color: #64748b;">Manage and update the rooms you have listed</p>
      </div>
      <a href="add-room.html" class="btn btn-primary rounded-pill px-4 shadow-sm" style="background-color: #2563eb; border-color: #2563eb;">
        <i class="bi bi-plus-lg me-1"></i> Post New Room
      </a>
    </div>

    <!-- Alert Container -->
    <div id="alertContainer"></div>

    <!-- Listings Grid -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="myRoomsGrid">
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading your listings...</span>
        </div>
      </div>
    </div>

    <!-- Empty State -->
    <div id="noMyRoomsMessage" class="text-center py-5 d-none">
      <div class="mb-3">
        <i class="bi bi-house-door text-muted" style="font-size: 3.5rem; color: #64748b;"></i>
      </div>
      <h4 class="fw-bold" style="color: #0f172a;">No rooms listed yet</h4>
      <p class="text-muted" style="color: #64748b;">You haven't posted any room listings yet.</p>
      <a href="add-room.html" class="btn btn-primary mt-2 rounded-pill px-4" style="background-color: #2563eb; border-color: #2563eb;">Post Your First Room</a>
    </div>
  </main>

  <!-- Edit Room Bootstrap Modal -->
  <div class="modal fade" id="editRoomModal" tabindex="-1" aria-labelledby="editRoomModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content border-0 shadow" style="border-radius: 1rem; box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.25);">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="editRoomModalLabel" style="color: #0f172a;">Edit Room Listing</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="editRoomForm">
          <div class="modal-body p-4">
            <input type="hidden" id="editRoomId">

            <div class="mb-3">
              <label for="editTitle" class="form-label" style="font-weight: 600; font-size: 0.875rem; color: #475569;">Listing Title <span class="text-danger" style="color: #ef4444;">*</span></label>
              <input type="text" id="editTitle" class="form-control" required>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label for="editLocation" class="form-label" style="font-weight: 600; font-size: 0.875rem; color: #475569;">Location <span class="text-danger" style="color: #ef4444;">*</span></label>
                <input type="text" id="editLocation" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label for="editPrice" class="form-label" style="font-weight: 600; font-size: 0.875rem; color: #475569;">Monthly Rent (Rs.) <span class="text-danger" style="color: #ef4444;">*</span></label>
                <input type="number" id="editPrice" class="form-control" min="1" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="editContact" class="form-label" style="font-weight: 600; font-size: 0.875rem; color: #475569;">Contact Phone Number (10 Digits) <span class="text-danger" style="color: #ef4444;">*</span></label>
              <input type="tel" id="editContact" class="form-control" maxlength="10" required>
            </div>

            <div class="mb-3">
              <label for="editDescription" class="form-label" style="font-weight: 600; font-size: 0.875rem; color: #475569;">Description <span class="text-danger" style="color: #ef4444;">*</span></label>
              <textarea id="editDescription" class="form-control" rows="4" required></textarea>
            </div>

            <!-- Edit Images -->
            <div class="mb-3">
              <label class="form-label d-flex justify-content-between" style="font-weight: 600; font-size: 0.875rem; color: #475569;">
                <span>Room Photos <small class="text-muted" style="color: #64748b;">(Max 5)</small></span>
                <span id="editImageCounter" class="badge" style="background-color: #64748b;">0 / 5</span>
              </label>

              <div class="border rounded p-3" style="background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.5rem;">
                <div class="mb-2">
                  <input type="file" id="editImageFileInput" class="form-control" accept="image/*">
                </div>
                <div id="editImagePreviewContainer" class="d-flex flex-wrap gap-2 mt-2"></div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" id="saveEditBtn" class="btn btn-primary px-4" style="background-color: #2563eb; border-color: #2563eb;">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div id="footerContainer"></div>

  <!-- Bootstrap 5 JS Bundle & Custom Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    let currentUser = null;
    let editModalInstance = null;
    let editingImages = [];
    let myRoomsList = [];

    document.addEventListener('DOMContentLoaded', () => {
      currentUser = requireAuth();
      if (!currentUser) return;

      renderNavbar('my-rooms');
      renderFooter();

      editModalInstance = new bootstrap.Modal(document.getElementById('editRoomModal'));

      // Edit phone input numbers only
      document.getElementById('editContact').addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/\D/g, '');
      });

      // Edit image file picker
      document.getElementById('editImageFileInput').addEventListener('change', handleEditImageUpload);

      // Edit form submit
      document.getElementById('editRoomForm').addEventListener('submit', handleSaveRoomEdit);

      loadMyRooms();
    });

    async function loadMyRooms() {
      const grid = document.getElementById('myRoomsGrid');
      const emptyMsg = document.getElementById('noMyRoomsMessage');

      try {
        const res = await fetch(`${API_BASE}/my-rooms?user_id=${currentUser.id}`);
        if (!res.ok) throw new Error('Failed to load your rooms');

        myRoomsList = await res.json();
        grid.innerHTML = '';

        if (myRoomsList.length === 0) {
          emptyMsg.classList.remove('d-none');
          return;
        }
        emptyMsg.classList.add('d-none');

        myRoomsList.forEach(room => {
          const images = parseImages(room.images);
          const firstImg = images.length > 0 ? images[0] : 'https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=600&auto=format&fit=crop&q=60';
          const isAvailable = room.status === 'available';

          const col = document.createElement('div');
          col.className = 'col';
          col.innerHTML = `
            <div class="card h-100" style="border: 1px solid #e2e8f0; border-radius: 0.875rem; overflow: hidden; background: #ffffff; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);">
              <div class="position-relative">
                <img src="${firstImg}" class="card-img-top" style="height: 210px; width: 100%; object-fit: cover; background-color: #f1f5f9;" alt="${room.title}" onerror="this.src='https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=600&auto=format&fit=crop&q=60'">
                <div class="position-absolute bottom-0 start-0 m-2">
                  <span style="${isAvailable ? 'background-color: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0;' : 'background-color: #fef2f2; color: #991b1b; border: 1px solid #fecaca;'} font-weight: 600; font-size: 0.8rem; padding: 0.35rem 0.65rem; border-radius: 9999px; display: inline-block;">
                    <i class="bi ${isAvailable ? 'bi-check-circle-fill' : 'bi-x-circle-fill'} me-1"></i>${room.status.toUpperCase()}
                  </span>
                </div>
              </div>
              <div class="card-body d-flex flex-column">
                <h5 class="card-title fw-bold text-truncate" title="${room.title}">${room.title}</h5>
                <p class="card-text text-muted small mb-2"><i class="bi bi-geo-alt-fill text-danger me-1"></i>${room.location}</p>
                <div class="d-flex justify-content-between align-items-center mb-3">
                  <span class="fs-5 fw-bold" style="color: #2563eb;">${formatPrice(room.price)}</span>
                  <small class="text-muted"><i class="bi bi-telephone me-1"></i>${room.contact}</small>
                </div>

                <!-- Status Toggle Switch / Button -->
                <div class="mb-3">
                  <button class="btn btn-sm ${isAvailable ? 'btn-outline-warning text-dark' : 'btn-outline-success'} w-100" onclick="toggleRoomStatus(${room.id}, '${room.status}')">
                    <i class="bi ${isAvailable ? 'bi-lock' : 'bi-unlock'} me-1"></i> Mark as ${isAvailable ? 'Rented' : 'Available'}
                  </button>
                </div>

                <!-- Actions: Edit, Delete, View -->
                <div class="d-flex gap-2 mt-auto pt-2 border-top">
                  <a href="room-details.html?id=${room.id}" class="btn btn-light btn-sm flex-grow-1" title="View room">
                    <i class="bi bi-eye"></i> View
                  </a>
                  <button class="btn btn-outline-primary btn-sm flex-grow-1" onclick="openEditModal(${room.id})" title="Edit listing">
                    <i class="bi bi-pencil"></i> Edit
                  </button>
                  <button class="btn btn-outline-danger btn-sm" onclick="deleteRoom(${room.id})" title="Delete listing">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </div>
            </div>
          `;
          grid.appendChild(col);
        });

      } catch (err) {
        console.error(err);
        grid.innerHTML = '';
        showAlert('Could not load your room listings. Please make sure the backend server is running.', 'danger');
      }
    }

    async function toggleRoomStatus(roomId, currentStatus) {
      const newStatus = currentStatus === 'available' ? 'rented' : 'available';

      try {
        const res = await fetch(`${API_BASE}/rooms/${roomId}/status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus, user_id: currentUser.id })
        });

        if (res.ok) {
          loadMyRooms();
        } else {
          const data = await res.json();
          alert(data.error || 'Failed to update status');
        }
      } catch (err) {
        console.error(err);
        alert('Server error occurred');
      }
    }

    async function deleteRoom(roomId) {
      if (!confirm('Are you sure you want to permanently delete this room listing?')) {
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/rooms/${roomId}`, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: currentUser.id })
        });

        if (res.ok) {
          showAlert('Room deleted successfully', 'success');
          loadMyRooms();
        } else {
          const data = await res.json();
          alert(data.error || 'Failed to delete room');
        }
      } catch (err) {
        console.error(err);
        alert('Server error occurred');
      }
    }

    function openEditModal(roomId) {
      const room = myRoomsList.find(r => r.id === roomId);
      if (!room) return;

      document.getElementById('editRoomId').value = room.id;
      document.getElementById('editTitle').value = room.title;
      document.getElementById('editLocation').value = room.location;
      document.getElementById('editPrice').value = room.price;
      document.getElementById('editContact').value = room.contact;
      document.getElementById('editDescription').value = room.description || '';

      editingImages = parseImages(room.images);
      renderEditImagePreviews();

      editModalInstance.show();
    }

    function handleEditImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      if (editingImages.length >= 5) {
        alert('Maximum 5 images allowed');
        e.target.value = '';
        return;
      }

      const reader = new FileReader();
      reader.onload = (event) => {
        editingImages.push(event.target.result);
        renderEditImagePreviews();
        e.target.value = '';
      };
      reader.readAsDataURL(file);
    }

    function removeEditImage(idx) {
      editingImages.splice(idx, 1);
      renderEditImagePreviews();
    }

    function renderEditImagePreviews() {
      const container = document.getElementById('editImagePreviewContainer');
      const counter = document.getElementById('editImageCounter');
      counter.textContent = `${editingImages.length} / 5`;

      container.innerHTML = '';
      editingImages.forEach((imgSrc, idx) => {
        const box = document.createElement('div');
        box.style = 'position: relative; width: 100px; height: 100px; border-radius: 0.5rem; overflow: hidden; border: 1px solid #cbd5e1;';
        box.innerHTML = `
          <img src="${imgSrc}" style="width: 100%; height: 100%; object-fit: cover;" alt="Room photo ${idx + 1}">
          <button type="button" style="position: absolute; top: 4px; right: 4px; background: rgba(239, 68, 68, 0.9); color: #ffffff; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; line-height: 1; display: flex; align-items: center; justify-content: center; cursor: pointer;" onclick="removeEditImage(${idx})" title="Remove photo">&times;</button>
        `;
        container.appendChild(box);
      });
    }

    async function handleSaveRoomEdit(e) {
      e.preventDefault();
      const roomId = document.getElementById('editRoomId').value;
      const title = document.getElementById('editTitle').value.trim();
      const location = document.getElementById('editLocation').value.trim();
      const price = document.getElementById('editPrice').value.trim();
      const contact = document.getElementById('editContact').value.trim();
      const description = document.getElementById('editDescription').value.trim();
      const saveBtn = document.getElementById('saveEditBtn');

      if (contact.length !== 10) {
        alert('Contact number must be exactly 10 digits.');
        return;
      }

      saveBtn.disabled = true;
      saveBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Saving...';

      try {
        const res = await fetch(`${API_BASE}/rooms/${roomId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title,
            location,
            price: parseInt(price),
            contact,
            description,
            images: editingImages,
            user_id: currentUser.id
          })
        });

        const data = await res.json();
        if (res.ok) {
          editModalInstance.hide();
          showAlert('Room updated successfully!', 'success');
          loadMyRooms();
        } else {
          alert(data.error || 'Failed to update room');
        }
      } catch (err) {
        console.error(err);
        alert('Failed to save changes');
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = 'Save Changes';
      }
    }
  </script>
</body>
</html>
