<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - EasyRoom</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar -->
  <div id="navbarContainer"></div>

  <!-- Main Container -->
  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card p-4 p-md-5 form-card">
          <div class="text-center mb-4">
            <div class="bg-primary-subtle text-primary d-inline-flex p-3 rounded-circle mb-3">
              <i class="bi bi-person-plus fs-2"></i>
            </div>
            <h3 class="fw-bold">Create Account</h3>
            <p class="text-muted">Join EasyRoom to rent or list rooms easily</p>
          </div>

          <!-- Alert Container -->
          <div id="alertContainer"></div>

          <form id="registerForm">
            <div class="mb-3">
              <label for="name" class="form-label">Full Name</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                <input type="text" id="name" class="form-control" placeholder="John Doe" required autocomplete="name">
              </div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
                <input type="email" id="email" class="form-control" placeholder="name@example.com" required autocomplete="email">
              </div>
            </div>

            <div class="mb-3">
              <label for="phone" class="form-label">Phone Number (10 Digits)</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-telephone"></i></span>
                <input type="tel" id="phone" class="form-control" placeholder="98XXXXXXXX" maxlength="10" required autocomplete="tel">
              </div>
              <small class="text-muted" id="phoneHint">Must be exactly 10 digits</small>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label">Password (Min 8 characters)</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                <input type="password" id="password" class="form-control" minlength="8" placeholder="Create a strong password" required autocomplete="new-password">
              </div>
              <small class="text-muted">At least 8 characters</small>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary btn-lg w-100 rounded-pill shadow-sm mb-3">
              Create Account
            </button>
          </form>

          <div class="text-center pt-3 border-top mt-2">
            <p class="text-muted mb-0">Already have an account? <a href="login.html" class="text-primary fw-semibold text-decoration-none">Sign in</a></p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <div id="footerContainer"></div>

  <!-- Bootstrap 5 JS Bundle & Custom Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, redirect
      const user = getAuthUser();
      if (user) {
        window.location.href = 'index.html';
        return;
      }

      renderNavbar('register');
      renderFooter();

      // Only allow numbers in phone
      const phoneInput = document.getElementById('phone');
      phoneInput.addEventListener('input', (e) => {
        phoneInput.value = phoneInput.value.replace(/\D/g, '');
      });

      document.getElementById('registerForm').addEventListener('submit', handleRegister);
    });

    async function handleRegister(e) {
      e.preventDefault();
      clearAlert();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submitBtn');

      if (phone.length !== 10) {
        showAlert('Phone number must be exactly 10 digits.', 'danger');
        return;
      }

      if (password.length < 8) {
        showAlert('Password must be at least 8 characters long.', 'danger');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating Account...';

      try {
        const res = await fetch(`${API_BASE}/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, phone, password })
        });

        const data = await res.json();

        if (res.ok) {
          showAlert('Account registered successfully! Redirecting to login...', 'success');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1500);
        } else {
          showAlert(data.error || 'Failed to register', 'danger');
        }
      } catch (err) {
        console.error(err);
        showAlert('Cannot connect to server. Please try again.', 'danger');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Create Account';
      }
    }
  </script>
</body>
</html>
