<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room Details - EasyRoom</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar -->
  <div id="navbarContainer"></div>

  <!-- Main Container -->
  <main class="container my-4">
    <!-- Breadcrumb & Back button -->
    <div class="d-flex align-items-center justify-content-between mb-3">
      <a href="index.html" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
        <i class="bi bi-arrow-left me-1"></i> Back to Rooms
      </a>
      <div id="favBtnWrapper"></div>
    </div>

    <div id="alertContainer"></div>

    <!-- Details Container -->
    <div id="roomDetailsContent">
      <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading room details...</span>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <div id="footerContainer"></div>

  <!-- Bootstrap 5 JS Bundle & Custom Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('id');
    const currentUser = getAuthUser();
    let isFavorited = false;

    document.addEventListener('DOMContentLoaded', () => {
      renderNavbar();
      renderFooter();

      if (!roomId) {
        showAlert('No room ID provided in URL.', 'danger');
        document.getElementById('roomDetailsContent').innerHTML = '<div class="text-center py-5"><h4>Room not found</h4></div>';
        return;
      }

      loadRoomDetails();
    });

    async function loadRoomDetails() {
      try {
        // Fetch room data
        const res = await fetch(`${API_BASE}/rooms/${roomId}`);
        if (!res.ok) {
          throw new Error('Room not found or server error');
        }
        const room = await res.json();

        // Check favorite status if logged in
        if (currentUser) {
          const favRes = await fetch(`${API_BASE}/favorites/${currentUser.id}`);
          if (favRes.ok) {
            const favs = await favRes.json();
            isFavorited = favs.some(f => f.id == roomId);
          }
        }

        renderRoom(room);
      } catch (err) {
        console.error(err);
        showAlert(err.message || 'Error loading room details', 'danger');
        document.getElementById('roomDetailsContent').innerHTML = `
          <div class="text-center py-5">
            <h4 class="text-danger">Room Not Found</h4>
            <p class="text-muted">This room listing may have been removed or does not exist.</p>
            <a href="index.html" class="btn btn-primary mt-2">Browse Other Rooms</a>
          </div>
        `;
      }
    }

    function renderRoom(room) {
      document.title = `${room.title} - EasyRoom`;

      // Favorite button top right
      const favBtnWrapper = document.getElementById('favBtnWrapper');
      favBtnWrapper.innerHTML = `
        <button id="detailFavBtn" class="btn ${isFavorited ? 'btn-danger' : 'btn-outline-danger'} rounded-pill px-3" onclick="toggleDetailFavorite()">
          <i class="bi ${isFavorited ? 'bi-heart-fill' : 'bi-heart'} me-1"></i>
          <span>${isFavorited ? 'Saved in Favorites' : 'Save to Favorites'}</span>
        </button>
      `;

      const images = parseImages(room.images);
      const isAvailable = room.status === 'available';

      // Build Carousel or Single Image
      let imageHtml = '';
      if (images.length === 0) {
        imageHtml = `
          <img src="https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=1200&auto=format&fit=crop&q=80" class="details-carousel-img" alt="${room.title}">
        `;
      } else if (images.length === 1) {
        imageHtml = `
          <img src="${images[0]}" class="details-carousel-img" alt="${room.title}" onerror="this.src='https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=1200&auto=format&fit=crop&q=80'">
        `;
      } else {
        const indicators = images.map((_, idx) => `
          <button type="button" data-bs-target="#roomCarousel" data-bs-slide-to="${idx}" class="${idx === 0 ? 'active' : ''}" aria-current="${idx === 0 ? 'true' : 'false'}" aria-label="Slide ${idx + 1}"></button>
        `).join('');

        const slides = images.map((img, idx) => `
          <div class="carousel-item ${idx === 0 ? 'active' : ''}">
            <img src="${img}" class="d-block w-100 details-carousel-img" alt="Room image ${idx + 1}">
          </div>
        `).join('');

        imageHtml = `
          <div id="roomCarousel" class="carousel slide shadow-sm rounded-4 overflow-hidden" data-bs-ride="carousel">
            <div class="carousel-indicators">
              ${indicators}
            </div>
            <div class="carousel-inner">
              ${slides}
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#roomCarousel" data-bs-slide="prev">
              <span class="carousel-control-prev-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#roomCarousel" data-bs-slide="next">
              <span class="carousel-control-next-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Next</span>
            </button>
          </div>
        `;
      }

      const content = document.getElementById('roomDetailsContent');
      content.innerHTML = `
        <div class="row g-4">
          <!-- Left Column: Photos & Description -->
          <div class="col-lg-8">
            <div class="mb-4">
              ${imageHtml}
            </div>

            <div class="card p-4 shadow-sm border-0 mb-4 rounded-4">
              <div class="d-flex justify-content-between align-items-start mb-3">
                <div>
                  <span class="${isAvailable ? 'badge-available' : 'badge-rented'} mb-2 d-inline-block">
                    <i class="bi ${isAvailable ? 'bi-check-circle-fill' : 'bi-x-circle-fill'} me-1"></i>${room.status.toUpperCase()}
                  </span>
                  <h2 class="fw-bold mb-1">${room.title}</h2>
                  <p class="text-muted"><i class="bi bi-geo-alt-fill text-danger me-1"></i>${room.location}</p>
                </div>
              </div>

              <hr>

              <h5 class="fw-bold mb-3">About this room</h5>
              <p class="text-secondary" style="white-space: pre-line; line-height: 1.7;">
                ${room.description || 'No description provided.'}
              </p>
            </div>
          </div>

          <!-- Right Column: Price & Owner Contact Card -->
          <div class="col-lg-4">
            <div class="card p-4 shadow-sm border-0 sticky-top rounded-4" style="top: 90px;">
              <div class="mb-4 pb-3 border-bottom">
                <span class="text-muted small text-uppercase fw-semibold">Rent Price</span>
                <div class="d-flex align-items-baseline mt-1">
                  <h2 class="text-primary fw-bold mb-0">${formatPrice(room.price)}</h2>
                  <span class="text-muted ms-2">/ month</span>
                </div>
              </div>

              <h5 class="fw-bold mb-3">Owner Information</h5>
              <div class="d-flex align-items-center mb-3">
                <div class="bg-primary-subtle text-primary rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 50px; height: 50px; font-size: 1.4rem;">
                  <i class="bi bi-person-fill"></i>
                </div>
                <div>
                  <h6 class="fw-bold mb-0">${room.owner_name || 'Room Owner'}</h6>
                  <small class="text-muted">Listed on EasyRoom</small>
                </div>
              </div>

              <div class="card bg-light border-0 p-3 mb-3 rounded-3">
                <div class="small text-muted mb-1">Direct Contact Number</div>
                <div class="fs-5 fw-bold text-dark d-flex align-items-center justify-content-between">
                  <span><i class="bi bi-telephone-fill text-success me-2"></i>${room.contact}</span>
                </div>
              </div>

              <a href="tel:${room.contact}" class="btn btn-success btn-lg w-100 mb-2 rounded-pill shadow-sm">
                <i class="bi bi-telephone-outbound me-2"></i> Call Owner
              </a>

              <a href="https://wa.me/977${room.contact}" target="_blank" class="btn btn-outline-success btn-lg w-100 rounded-pill">
                <i class="bi bi-whatsapp me-2"></i> WhatsApp Message
              </a>
            </div>
          </div>
        </div>
      `;
    }

    async function toggleDetailFavorite() {
      if (!currentUser) {
        alert('Please login to save rooms to your favorites!');
        window.location.href = `login.html?redirect=${encodeURIComponent(window.location.pathname.split('/').pop() + window.location.search)}`;
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/favorites/toggle`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: currentUser.id, room_id: roomId })
        });

        const data = await res.json();
        if (res.ok) {
          isFavorited = data.isFavorited;
          const btn = document.getElementById('detailFavBtn');
          if (isFavorited) {
            btn.className = 'btn btn-danger rounded-pill px-3';
            btn.innerHTML = '<i class="bi bi-heart-fill me-1"></i> <span>Saved in Favorites</span>';
          } else {
            btn.className = 'btn btn-outline-danger rounded-pill px-3';
            btn.innerHTML = '<i class="bi bi-heart me-1"></i> <span>Save to Favorites</span>';
          }
        } else {
          alert(data.error || 'Failed to toggle favorite');
        }
      } catch (err) {
        console.error(err);
        alert('Server connection error');
      }
    }
  </script>
</body>
</html>
